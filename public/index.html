<!DOCTYPE html>
<html lang="fr">
  <head>
    <!--
      Balise Google (gtag.js) — compte Ads du cabinet.

      GT-577MXS7J : balise Google.
      AW-18491848216 : destination Google Ads (suivi des campagnes).

      Consent Mode v2 : par defaut tout est refuse. Le bandeau React
      (CookieBanner) met a jour le consentement. Un visiteur deja d'accord
      est relu ici avant gtag('config'), pour eviter un ping trop tot.

      Google demande ce bloc juste apres <head>, sur toutes les pages.
      Ici le fichier est le squelette Create React App : une seule insertion
      couvre tout le site. Ne pas ajouter une seconde balise Google ailleurs.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      try {
        if (localStorage.getItem('cabinet-jade-cookie-consent') === 'granted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            analytics_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      } catch (e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=GT-577MXS7J"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'GT-577MXS7J');
      gtag('config', 'AW-18491848216');
    </script>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#219ebc" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Titre et description de la page d'accueil. Les autres pages les
      remplacent a l'affichage via le composant src/components/Seo.tsx, qui
      lit src/config/seo.ts.
    -->
    <title>Chiropracteur à Creully-sur-Seulles | Jade Philippe</title>
    <meta
      name="description"
      content="Jade Philippe, chiropracteur à Creully-sur-Seulles dans le Calvados. Cabinet de plain-pied avec parking, rendez-vous en ligne."
    />
    <link rel="canonical" href="https://jadephilippe-chiropraxie.fr" />

    <!--
      Apercu lors d'un partage sur une messagerie ou un reseau social.
      Ces balises restent ecrites ici, et non dans le composant Seo : les
      robots des messageries n'executent pas le JavaScript.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Centre de Chiropraxie Jade Philippe" />
    <meta property="og:title" content="Chiropracteur à Creully-sur-Seulles | Jade Philippe" />
    <meta
      property="og:description"
      content="Jade Philippe, chiropracteur à Creully-sur-Seulles dans le Calvados. Cabinet de plain-pied avec parking, rendez-vous en ligne."
    />
    <meta property="og:url" content="https://jadephilippe-chiropraxie.fr" />
    <meta property="og:image" content="https://jadephilippe-chiropraxie.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Salle de soins du cabinet de chiropraxie de Jade Philippe" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Donnees structurees de l'etablissement, lues par Google.

      /!\ A TENIR SYNCHRONISE A LA MAIN avec src/config/cabinet.ts.
      Ce bloc est volontairement statique : injecte par React, il serait
      moins fiablement lu. Toute modification d'adresse, d'email ou
      d'horaires doit etre reportee ici.

      Ne jamais ajouter "aggregateRating" ni "review" : inventer une note ou
      un avis est une violation des regles de Google et une tromperie envers
      les patients.

      Verifier apres toute modification :
      https://search.google.com/test/rich-results
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Chiropractic",

        "url": "https://jadephilippe-chiropraxie.fr",
        "image": "https://jadephilippe-chiropraxie.fr/og-image.jpg",
        "telephone": "+33695112755",
        "email": "jadephilippe.chiropraxie@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "63 Rue de Caen",
          "postalCode": "14480",
          "addressLocality": "Creully-sur-Seulles",
          "addressRegion": "Calvados",
          "addressCountry": "FR"
        },
        "openingHoursSpecification": [
          {
